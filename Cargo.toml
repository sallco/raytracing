[package]
name = "raytracing"
version = "0.1.0"
edition = "2024"
authors = ["sallco <dcalderon918@gmail.com>"]
description = "Diorama renderizado por raytracing en CPU"
license = "UNLICENSED"
publish = false

[dependencies]
raylib = "5.5.1"

# Un poco de optimización durante la iteración para mantener interactiva la escena.
[profile.dev]
opt-level = 1
debug = 1

# Perfil para las capturas y el video final: prioriza velocidad de renderizado.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
